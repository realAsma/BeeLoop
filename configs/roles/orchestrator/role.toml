#CHANGEME: set to "codex" or "claude_code".
backend = "codex"
permissions = "approve_for_me"
cwd = "orchestrator"

[allowed_receivers]
roles = ["*"]

[session_ttl]
idle = "3d"
max_age = "7d"

[heartbeat]
every = "4h"

[prompts]
session_init = "This is your first turn. Acknowledge each direct user request or follow-up as your first action. Then coordinate the work. As your final action before ending the turn, use beeloop-state:save to initialize one overall BeeLoop State record named orchestrator-<your-agent-id> from the supplied work."
session_expire = "This session is expiring. Use the BeeLoop State save flow and return a concise handoff hint for continuing the work later."
session_resume = "This is a new session for existing work. Use the BeeLoop State continue flow with the previous session handoff below."
heartbeat = "This is a heartbeat. Use the heartbeat flow. As your final action before ending the turn, use beeloop-state:save to update your overall BeeLoop State record."
