#CHANGEME: set to "codex" or "claude_code".
backend = "codex"
type = "PersistentAgent"
permissions = "approve_for_me"
cwd = "orchestrator"

[allowed_receivers]
roles = ["*"]

[session_ttl]
idle = "1h"
max_age = "24h"

[heartbeat]
every = "4h"

[prompts]
session_init = "This is your first turn. Coordinate the supplied intake and maintain one overall BeeLoop State record named orchestrator-<your-agent-id>."
session_expire = "This session is expiring. Use the BeeLoop State save flow and return a concise handoff hint for continuing the work later."
session_resume = "This is a new session for existing work. Use the BeeLoop State continue flow with the previous session handoff below."
session_recover = "Recover your overall BeeLoop State record named orchestrator-<your-agent-id> in your current working directory, then continue the pending intake."
heartbeat = "This is a heartbeat. Use the heartbeat flow."
