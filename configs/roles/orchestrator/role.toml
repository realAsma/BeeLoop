#CHANGEME: set to "codex" or "claude_code".
backend = "codex"
permissions = "approve_for_me"
cwd = "workspaces/orchestrator"

[allowed_receivers]
roles = ["*"]

[session_ttl]
idle = "1h"
max_age = "24h"

[heartbeat]
every = "4h"

[prompts]
session_init = "This is your first turn. Use the first-turn flow."
session_expire = "This session is expiring. Use the BeeLoop State save flow and return a concise handoff hint for continuing the work later."
session_resume = "This is a new session for existing work. Use the BeeLoop State continue flow with the previous session handoff below."
heartbeat = "This is a heartbeat. Use the heartbeat flow."
