# A rank, not a job. Many orchestrators run at once, one per task, all sharing
# one cwd -- so editing the files there changes every live one, which is the
# point. Real file work happens in a worker's cwd.
#
# Configuration lives here and is never copied. `template/` is the material:
# it lands in `cwd` at creation, and never over a file already there.
backend     = "claude_code"
permissions = "yolo"
cwd         = "workspaces/orchestrator"

# Carried, not yet interpreted: refresh is a later phase.
refresh_policy = { every = "4h", checkpoint = "1h" }

# Only this adapter reads this block, and nothing outside it may look inside.
[backend_options.claude_code]

[messaging.send]
roles = []
ids = []

[messaging.receive]
roles = []
ids = []
