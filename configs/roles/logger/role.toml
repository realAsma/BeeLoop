# A role is configuration plus a template. This one works in a directory of its
# own rather than in here: `role.toml` is never copied, and `template/` is what
# lands in that cwd at creation, so the instructions are files the agent reads
# every turn instead of prose repeated in every envelope.
backend     = "claude_code"
permissions = "yolo"
cwd         = "test_workspace"
