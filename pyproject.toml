[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beeloop"
version = "0.1.0"
description = "Long-running agents that live in a directory and are addressed by letter."
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "mcp",
]

[project.optional-dependencies]
slack = ["slack-sdk"]

[project.scripts]
beeloop = "beeloop.cli:main"
beeloop-dispatch = "beeloop.dispatch.dispatch:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "beeloop",
    "beeloop.agents",
    "beeloop.agents.backends",
    "beeloop.dispatch",
]

[tool.setuptools.package-data]
"beeloop.agents" = ["assets/*.json"]
