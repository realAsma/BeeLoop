[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "beebot"
version = "0.1.0"
description = "Long-running agents that live in a directory and are addressed by letter."
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "mcp",
]

[project.optional-dependencies]
slack = ["slack-sdk"]

[project.scripts]
beebot-dispatch = "beebot.dispatch.dispatch:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "beebot",
    "beebot.agents",
    "beebot.agents.backends",
    "beebot.dispatch",
]

[tool.setuptools.package-data]
"beebot.agents" = ["assets/*.json"]
